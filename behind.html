<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abandoned But Not Forgotten | NASA Space Apps</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #05070f;
            --card-bg: rgba(15, 23, 42, 0.85);
            --accent-cyan: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(56, 189, 248, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(139, 92, 246, 0.1) 0%, transparent 40%);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .header-title {
            text-align: center;
            margin-bottom: 25px;
        }

        .header-title h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 3px;
            color: var(--accent-cyan);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .header-title h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px var(--accent-glow);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: var(--accent-cyan);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .counter {
            font-family: 'Orbitron', sans-serif;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-cyan);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-cyan);
        }

        .artifact-header {
            margin-bottom: 20px;
        }

        .artifact-header h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.9rem;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .location-tag {
            color: var(--text-muted);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .story-content {
            background: rgba(5, 7, 15, 0.6);
            border-left: 3px solid var(--accent-cyan);
            border-radius: 0 12px 12px 0;
            padding: 22px;
            font-size: 1.05rem;
            line-height: 1.7;
            color: #cbd5e1;
            margin: 20px 0;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }

        .stat-card .label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .stat-card .value {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            color: var(--accent-cyan);
            font-weight: 600;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        button {
            font-family: 'Orbitron', sans-serif;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-cyan);
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 12px 28px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover:not(:disabled) {
            background: var(--accent-cyan);
            color: #05070f;
            box-shadow: 0 0 20px var(--accent-glow);
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: var(--border-color);
            color: var(--text-muted);
        }

        footer {
            margin-top: 25px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        footer a {
            color: var(--accent-cyan);
            text-decoration: none;
        }

        @media (max-width: 650px) {
            .stats-container {
                grid-template-columns: 1fr;
            }
            .container {
                padding: 22px;
            }
        }
    </style>
</head>
<body>

    <div class="header-title">
        <h3>NASA Space Apps Challenge</h3>
        <h1>Abandoned But Not Forgotten</h1>
    </div>

    <div class="container">
        <div class="top-bar">
            <div class="status-badge">
                <span class="status-dot"></span>
                <span id="artifact-status">Status</span>
            </div>
            <div class="counter" id="artifact-counter">1 / 7</div>
        </div>

        <div class="artifact-header">
            <h2 id="artifact-name">Loading...</h2>
            <div class="location-tag">
                📍 <span id="artifact-location">Location</span>
            </div>
        </div>

        <div class="story-content" id="artifact-story">
            Loading mission log...
        </div>

        <div class="stats-container">
            <div class="stat-card">
                <div class="label">Launch Date</div>
                <div class="value" id="stat-launch">-</div>
            </div>
            <div class="stat-card">
                <div class="label">Mission Distance / Operational Span</div>
                <div class="value" id="stat-life">-</div>
            </div>
            <div class="stat-card">
                <div class="label">Primary Science Contribution</div>
                <div class="value" id="stat-legacy">-</div>
            </div>
        </div>

        <div class="controls">
            <button id="prev-btn" onclick="prevArtifact()">← PREVIOUS</button>
            <button id="next-btn" onclick="nextArtifact()">NEXT →</button>
        </div>
    </div>

    <footer>
        Data powered by <a href="https://data.nasa.gov/" target="_blank">NASA Open Data Portal</a> | Built for NASA Space Apps
    </footer>

    <script>
        const artifacts = [
            {
                name: "Opportunity Rover (Oppy)",
                status: "Final Transmission: June 10, 2018",
                location: "Endeavour Crater, Mars",
                story: "Designed for a 90-day mission, Opportunity explored Mars for over 14 years (5,352 Sols). It discovered hematite spheres ('blueberries') providing absolute proof that ancient liquid water once washed over the Martian surface before a global dust storm cut off solar power.",
                launch: "July 7, 2003",
                lifetime: "45.16 KM Traveled",
                legacy: "Proved Ancient Martian Habitability"
            },
            {
                name: "Apollo 15 Lunar Roving Vehicle",
                status: "Parked Since August 1971",
                location: "Hadley Rille, Moon",
                story: "The world's first electric car driven on another world. Left parked in the vacuum of space at Hadley-Apennine, it allowed astronauts to collect over 77 kg of lunar surface rock samples. It remains completely intact in the airless lunar environment.",
                launch: "July 26, 1971",
                lifetime: "27.8 KM Driven",
                legacy: "First Lunar Wheel Tracks"
            },
            {
                name: "Voyager 1 & The Golden Record",
                status: "Interstellar Mission Active",
                location: ">24 Billion KM From Earth",
                story: "Carrying a gold-plated copper phonograph record encoded with 115 images, natural Earth sounds, and greetings in 55 languages, Voyager 1 became the first human spacecraft to cross into interstellar space, acting as a cosmic time capsule.",
                launch: "September 5, 1977",
                lifetime: "47+ Years in Flight",
                legacy: "First Interstellar Spacecraft"
            },
            {
                name: "Spirit Rover (MER-A)",
                status: "Final Transmission: March 22, 2010",
                location: "Gusev Crater (Troy), Mars",
                story: "Twin sister to Opportunity, Spirit battled stuck wheels and harsh Martian winters for 6 years. Even when one front wheel failed, Spirit dragged it behind, accidentally carving open the Martian soil to reveal pure silica—proof of ancient hot springs.",
                launch: "June 10, 2003",
                lifetime: "7.73 KM Traveled",
                legacy: "Discovered Ancient Hydrothermal Vents"
            },
            {
                name: "Surveyor 3 Lander",
                status: "Landed April 20, 1967",
                location: "Oceanus Procellarum, Moon",
                story: "Surveyor 3 was an uncrewed lander sent to analyze lunar soil ahead of the Apollo human missions. Two years later, Apollo 12 astronauts landed nearby and physically walked up to Surveyor 3, removing its camera to bring it back to Earth for analysis.",
                launch: "April 17, 1967",
                lifetime: "3 Years Operational Ground Study",
                legacy: "Only Spacecraft Visited By Humans on Another World"
            },
            {
                name: "Venera 13 Lander",
                status: "Final Signal: 127 Minutes On Surface",
                location: "Phoebe Regio, Venus",
                story: "Enduring extreme conditions of 457°C (855°F) temperature and crushing atmospheric pressure 89 times greater than Earth's, Venera 13 survived long enough to transmit the first-ever color panoramas and soil analysis of the Venusian surface.",
                launch: "October 30, 1981",
                lifetime: "127 Minutes on Venus",
                legacy: "First Color Images & Audio Recording of Venus"
            },
            {
                name: "Kepler Space Telescope",
                status: "Decommissioned: October 30, 2018",
                location: "Trailing Earth Heliocentric Orbit",
                story: "Kepler stared at a single patch of sky containing 150,000 stars, monitoring microscopic dips in brightness as distant planets passed in front of them. When its reaction wheels failed, it retired in solar orbit after discovering over 2,600 confirmed exoplanets.",
                launch: "March 7, 2009",
                lifetime: "9.5 Years in Science Operation",
                legacy: "Discovered 2,600+ Exoplanets"
            }
        ];

        let currentIndex = 0;

        function updateUI() {
            const current = artifacts[currentIndex];
            document.getElementById('artifact-name').innerText = current.name;
            document.getElementById('artifact-status').innerText = current.status;
            document.getElementById('artifact-location').innerText = current.location;
            document.getElementById('artifact-story').innerText = current.story;
            document.getElementById('stat-launch').innerText = current.launch;
            document.getElementById('stat-life').innerText = current.lifetime;
            document.getElementById('stat-legacy').innerText = current.legacy;
            document.getElementById('artifact-counter').innerText = `${currentIndex + 1} / ${artifacts.length}`;

            document.getElementById('prev-btn').disabled = (currentIndex === 0);
            document.getElementById('next-btn').disabled = (currentIndex === artifacts.length - 1);
        }

        function nextArtifact() {
            if (currentIndex < artifacts.length - 1) {
                currentIndex++;
                updateUI();
            }
        }

        function prevArtifact() {
            if (currentIndex > 0) {
                currentIndex--;
                updateUI();
            }
        }

        updateUI();
    </script>
</body>
</html>
